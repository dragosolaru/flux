# Fly.io configuration for the Tesla HTTP Proxy.
# Deploy with: cd tesla-proxy && fly launch --copy-config --no-deploy
# Then: fly secrets set TESLA_PRIVATE_KEY="$(cat /path/to/private.pem | base64)"
# And:  fly deploy

app = "flux-tesla-proxy"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
