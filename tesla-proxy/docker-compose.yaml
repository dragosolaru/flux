# Coolify: New Resource → Docker Compose → point it at this repository with
# Base Directory /tesla-proxy. Coolify reads this file, builds the image, asks
# for the one secret below, and issues the certificate itself.
#
# The signing key is NOT in here and must never be. Committing it would put a
# key that can unlock and drive cars into git history, and the only remedy then
# is generating a new pair, re-registering the partner account and re-pairing
# the Virtual Key on every vehicle. Coolify stores it encrypted; paste it there.

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      # Coolify's magic variable: it generates the public hostname for this
      # service, points it at container port 8080, and gets the Let's Encrypt
      # certificate. Leave it valueless — Coolify fills it in and shows the
      # result in the UI, where it can be replaced with your own hostname.
      #
      # That hostname is what TESLA_PROXY_BASE_URL must be set to in Vercel.
      - SERVICE_FQDN_PROXY_8080

      # Two ways to hand over the EC P-256 command-signing key. Both read the
      # value from Coolify; neither puts it in this file.
      #
      # Preferred — a mounted file. A PEM is five lines, which an environment
      # variable handles badly and a build argument handles worse (Coolify
      # prints build args in the deployment log). Coolify: Storages → Add File
      # Mount, then set TESLA_PRIVATE_KEY_FILE to the same path.
      - TESLA_PRIVATE_KEY_FILE=${TESLA_PRIVATE_KEY_FILE:-}
      #
      # Fallback — the key inline, as SINGLE-LINE base64: base64 -w0 < key.pem
      # A raw PEM pasted into a panel yields an EMPTY value, because .env holds
      # one line per variable; plain `base64` wraps at 76 columns, hence -w0.
      - TESLA_PRIVATE_KEY=${TESLA_PRIVATE_KEY:-}

    expose:
      - "8080"

    restart: unless-stopped

    # The proxy's own /health, served before its auth check, so it answers 200
    # without a token and — unlike probing /api/1/vehicles — logs nothing. The
    # request never leaves the container, so it costs no Fleet API quota.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
