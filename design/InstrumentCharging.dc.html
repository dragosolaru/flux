<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.78 0.17 195); }
    a:hover { color: oklch(0.86 0.17 195); }
    @keyframes sweep { from { stroke-dashoffset: 691; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(0.08 0.01 240); color: oklch(0.97 0 0); font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; padding: 0 24px; box-sizing: border-box; overflow: hidden">

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 20px; animation: rise .5s ease-out both">
    <span style="font-size: 15px; font-weight: 500">Încărcare</span>
    <span style="display: flex; align-items: center; gap: 7px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.72 0.17 155)">
      <span style="width: 5px; height: 5px; border-radius: 9999px; background: oklch(0.72 0.17 155)"></span>Încarcă
    </span>
  </div>

  <!-- The arc, second and last use in the app: session progress, not battery -->
  <div style="position: relative; display: flex; justify-content: center; margin-top: 18px">
    <svg width="272" height="272" viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="110" fill="none" stroke="oklch(0.97 0 0 / 8%)" stroke-width="1.5" stroke-dasharray="518 173" stroke-linecap="round" transform="rotate(135 150 150)"/>
      <circle cx="150" cy="150" r="110" fill="none" stroke="oklch(0.72 0.17 155)" stroke-width="4" stroke-dasharray="321 370" stroke-linecap="round" transform="rotate(135 150 150)" style="animation: sweep 1.1s cubic-bezier(.22,1,.36,1) both"/>
      <circle cx="150" cy="150" r="110" fill="none" stroke="oklch(0.97 0 0 / 45%)" stroke-width="10" stroke-dasharray="2 689" stroke-dashoffset="-414" transform="rotate(135 150 150)"/>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: rise .6s .15s ease-out both">
      <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.50 0.02 240)">Gata la</div>
      <div style="font-size: 56px; font-weight: 300; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin-top: 2px">21:40</div>
      <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: oklch(0.62 0.02 240); margin-top: 4px; font-variant-numeric: tabular-nums">peste 1h 20m</div>
    </div>
  </div>

  <!-- Live figures as a hairline table -->
  <div style="margin-top: 6px; animation: rise .6s .28s ease-out both">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid oklch(0.97 0 0 / 8%)">
      <div style="padding: 14px 0; border-right: 1px solid oklch(0.97 0 0 / 8%)">
        <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.50 0.02 240)">Putere</div>
        <div style="font-size: 21px; font-weight: 300; margin-top: 3px; font-variant-numeric: tabular-nums">48<span style="font-size: 12px; color: oklch(0.62 0.02 240); margin-left: 2px">kW</span></div>
      </div>
      <div style="padding: 14px 0 14px 16px; border-right: 1px solid oklch(0.97 0 0 / 8%)">
        <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.50 0.02 240)">Adăugat</div>
        <div style="font-size: 21px; font-weight: 300; margin-top: 3px; font-variant-numeric: tabular-nums">18.4<span style="font-size: 12px; color: oklch(0.62 0.02 240); margin-left: 2px">kWh</span></div>
      </div>
      <div style="padding: 14px 0 14px 16px">
        <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.50 0.02 240)">Cost</div>
        <div style="font-size: 21px; font-weight: 300; margin-top: 3px; font-variant-numeric: tabular-nums">14<span style="font-size: 12px; color: oklch(0.62 0.02 240); margin-left: 2px">lei</span></div>
      </div>
    </div>
  </div>

  <!-- The charge curve, as a hairline sparkline. Data, not decoration. -->
  <div style="margin-top: 4px; padding: 16px 0; border-top: 1px solid oklch(0.97 0 0 / 8%); animation: rise .6s .36s ease-out both">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.50 0.02 240)">Curba sesiunii</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; color: oklch(0.55 0.02 240)">62% → 80%</span>
    </div>
    <svg width="342" height="60" viewBox="0 0 342 60" style="margin-top: 10px">
      <path d="M0 46 C 40 44, 70 22, 110 16 S 190 10, 240 20 S 310 44, 342 52" fill="none" stroke="oklch(0.72 0.17 155)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="0" y1="59" x2="342" y2="59" stroke="oklch(0.97 0 0 / 8%)" stroke-width="1"/>
      <line x1="156" y1="0" x2="156" y2="59" stroke="oklch(0.97 0 0 / 14%)" stroke-width="1" stroke-dasharray="2 4"/>
      <circle cx="156" cy="14" r="3" fill="oklch(0.72 0.17 155)"/>
    </svg>
  </div>

  <!-- Controls, as rows -->
  <div style="animation: rise .6s .44s ease-out both">
    <div style="display: flex; align-items: center; gap: 14px; height: 56px; border-top: 1px solid oklch(0.97 0 0 / 8%)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.97 0 0)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span style="flex: 1; font-size: 16px">Oprește încărcarea</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.80 0.17 75)" stroke-width="1.5" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; height: 56px; border-top: 1px solid oklch(0.97 0 0 / 8%)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.97 0 0)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
      <span style="flex: 1; font-size: 16px">Curent</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; color: oklch(0.62 0.02 240); font-variant-numeric: tabular-nums">32 A</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; height: 56px; border-top: 1px solid oklch(0.97 0 0 / 8%); border-bottom: 1px solid oklch(0.97 0 0 / 8%)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.97 0 0)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span style="flex: 1; font-size: 16px">Programare</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; color: oklch(0.62 0.02 240); font-variant-numeric: tabular-nums">23:00</span>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid oklch(0.97 0 0 / 8%); padding: 14px 0 26px 0">
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.45 0.02 240)">Mașina</span>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.45 0.02 240)">Hartă</span>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.78 0.17 195)">Încărc.</span>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.45 0.02 240)">Mai mult</span>
  </div>
</div>
</x-dc>
</body>
</html>
