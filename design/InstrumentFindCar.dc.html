<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: oklch(0.78 0.17 195); }
    a:hover { color: oklch(0.86 0.17 195); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: oklch(0.08 0.01 240); color: oklch(0.97 0 0); font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; overflow: hidden">

  <!-- Map: hairlines only, same language as the rest -->
  <div style="position: absolute; inset: 0; background:
      repeating-linear-gradient(0deg, oklch(0.97 0 0 / 4%) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(90deg, oklch(0.97 0 0 / 4%) 0 1px, transparent 1px 72px)"></div>
  <div style="position: absolute; left: -40px; top: 430px; width: 470px; height: 1px; background: oklch(0.97 0 0 / 12%); transform: rotate(-8deg)"></div>
  <div style="position: absolute; left: 130px; top: -60px; width: 1px; height: 980px; background: oklch(0.97 0 0 / 12%); transform: rotate(6deg)"></div>

  <!-- The bearing, drawn as an instrument: a line and its arc, not a route -->
  <svg style="position: absolute; inset: 0" width="390" height="844">
    <circle cx="150" cy="560" r="46" fill="none" stroke="rgba(120,180,255,.20)" stroke-width="1"/>
    <line x1="150" y1="560" x2="252" y2="392" stroke="oklch(0.78 0.17 195)" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"/>
    <circle cx="150" cy="560" r="4" fill="oklch(0.78 0.17 195)"/>
    <circle cx="252" cy="392" r="9" fill="none" stroke="oklch(0.80 0.17 75)" stroke-width="1.5"/>
    <circle cx="252" cy="392" r="3" fill="oklch(0.80 0.17 75)"/>
  </svg>

  <!-- Header row: distance is the screen -->
  <div style="position: relative; padding: 20px 24px 0 24px; animation: rise .5s ease-out both">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: oklch(0.50 0.02 240)">Mașina ta</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: oklch(0.55 0.02 240)">acum 3 min</span>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 4px">
      <div style="display: flex; align-items: baseline; gap: 6px">
        <span style="font-size: 64px; font-weight: 300; line-height: .9; letter-spacing: -0.045em; font-variant-numeric: tabular-nums">180</span>
        <span style="font-size: 18px; font-weight: 300; color: oklch(0.62 0.02 240)">m</span>
      </div>
      <!-- The compass: rotates to the bearing, minus your heading -->
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.17 195)" stroke-width="1.25" stroke-linejoin="round" style="transform: rotate(31deg); margin-bottom: 6px"><path d="M12 3 19 20l-7-4-7 4 7-17Z"/></svg>
    </div>

    <div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.1em; color: oklch(0.55 0.02 240); margin-top: 2px">± 40 M PRECIZIE · 2 MIN PE JOS</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 26px 24px; animation: rise .6s .15s ease-out both">
    <div style="display: flex; align-items: center; gap: 14px; height: 56px; border-top: 1px solid oklch(0.97 0 0 / 8%)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.97 0 0)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <span style="flex: 1; font-size: 16px">Claxonează și clipește</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em; color: oklch(0.55 0.02 240)">2 S</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; height: 56px; border-top: 1px solid oklch(0.97 0 0 / 8%); border-bottom: 1px solid oklch(0.97 0 0 / 8%)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.17 195)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.4a4 4 0 0 1 1-2.6l4-4.5"/><path d="M16 20v-3a4 4 0 0 0-1-2.6L11 10"/><circle cx="14" cy="4" r="2"/></svg>
      <span style="flex: 1; font-size: 16px; color: oklch(0.78 0.17 195)">Indicații pe jos</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.78 0.17 195)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
